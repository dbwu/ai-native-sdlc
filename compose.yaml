services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - knowledge-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://knowledge:local-dev-only@db:5432/knowledge
      KNOWLEDGE_MODEL_PROVIDER: ${KNOWLEDGE_MODEL_PROVIDER:-disabled}
      KNOWLEDGE_MODEL_BASE_URL: ${KNOWLEDGE_MODEL_BASE_URL:-}
      KNOWLEDGE_MODEL_MODEL: ${KNOWLEDGE_MODEL_MODEL:-}
      KNOWLEDGE_MODEL_API_KEY: ${KNOWLEDGE_MODEL_API_KEY:-}
      KNOWLEDGE_MODEL_REQUIRE_KEY: ${KNOWLEDGE_MODEL_REQUIRE_KEY:-true}
      KNOWLEDGE_MODEL_RESPONSE_FORMAT: ${KNOWLEDGE_MODEL_RESPONSE_FORMAT:-json_object}
      KNOWLEDGE_MODEL_TOKEN_PARAMETER: ${KNOWLEDGE_MODEL_TOKEN_PARAMETER:-max_completion_tokens}
      KNOWLEDGE_MODEL_TIMEOUT_SECONDS: ${KNOWLEDGE_MODEL_TIMEOUT_SECONDS:-60}
      KNOWLEDGE_MODEL_MAX_OUTPUT_TOKENS: ${KNOWLEDGE_MODEL_MAX_OUTPUT_TOKENS:-8192}
      KNOWLEDGE_DESIGN_WORKER: ${KNOWLEDGE_DESIGN_WORKER:-enabled}
      KNOWLEDGE_EXECUTOR: disabled
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  knowledge-data:
